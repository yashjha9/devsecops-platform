---
name: SecureRelease CI Pipeline

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: application/requirements-dev.txt

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit==1.9.4

      - name: Run application tests
        working-directory: application
        env:
          DATABASE_URL: sqlite://
        run: python -m pytest test_app.py -v

      - name: Run Bandit security scan
        working-directory: application
        run: python -m bandit -r securerelease app.py -ll
