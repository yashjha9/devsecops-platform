---
name: SecureRelease CI Pipeline

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: application/requirements-dev.txt

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit==1.9.4

      - name: Run application tests
        working-directory: application
        env:
          DATABASE_URL: sqlite://
        run: python -m pytest test_app.py test_scanner_ingestion.py -v

      - name: Run Bandit security scan
        working-directory: application
        run: python -m bandit -r securerelease app.py -ll

      - name: Build SecureRelease Docker image
        run: docker build -t securerelease:ci ./application

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.69.3'
          image-ref: securerelease:ci
          format: json
          output: trivy-image-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          exit-code: '0'

      - name: Upload Trivy vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securerelease-trivy-report
          path: trivy-image-report.json
          retention-days: 30

  ingest-trivy-report:
    name: Ingest Trivy Report into SecureRelease
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v4
        with:
          name: securerelease-trivy-report
          path: trivy-report

      - name: Upload report to SecureRelease
        env:
          SECURERELEASE_API_TOKEN: ${{ secrets.SECURERELEASE_API_TOKEN }}
        shell: powershell
        run: |
          $headers = @{
            Authorization = "Bearer $env:SECURERELEASE_API_TOKEN"
          }

          $response = Invoke-RestMethod `
            -Uri "http://localhost:5003/api/projects/1/scan-reports/trivy" `
            -Method Post `
            -Headers $headers `
            -ContentType "application/json" `
            -InFile "trivy-report/trivy-image-report.json"

          Write-Host "Trivy report successfully ingested."
          $response.result | ConvertTo-Json -Depth 5
