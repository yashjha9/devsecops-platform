
{% extends "base.html" %}

{% block title %}Login | SecureRelease{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">

        <div class="content-panel">

            <div class="text-center mb-4">
                <h2 class="page-title">SecureRelease</h2>
                <p class="page-subtitle">
                    Sign in to your DevSecOps dashboard
                </p>
            </div>

            <form method="POST" action="{{ url_for('web_auth.login') }}">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Sign In
                </button>

            </form>

            <div class="text-center mt-4">
                <small>
                    Don't have an account?
                    <a href="{{ url_for('web_auth.register') }}">
                        Create account
                    </a>
                </small>
            </div>

        </div>

    </div>
</div>

{% endblock %}
